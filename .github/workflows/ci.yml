name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: file:ci.db
      TURSO_AUTH_TOKEN: ci-placeholder
      JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
      RATE_LIMIT_SALT: ci-only-rate-limit-salt-longer-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="60" cy="60" r="55" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner Circle for Depth -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Letter E -->
  <g transform="translate(25, 35)">
    <path d="M5 5 L5 45 L30 45 M5 25 L25 25 M5 5 L30 5" 
          stroke="url(#textGradient)" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
  
  <!-- Letter W -->
  <g transform="translate(65, 35)">
    <path d="M5 5 L10 45 L15 25 L20 45 L25 5" 
          stroke="url(#textGradient)" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="30" cy="30" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="90" cy="30" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="30" cy="90" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="90" cy="90" r="2" fill="rgba(255,255,255,0.6)"/>
</svg>